<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>As Minhas Notas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f5f7; --white: #fff; --accent: #5b4ef5; --accent-light: #ede9fe;
    --text: #111; --muted: #888; --border: #e0e0e8; --danger: #e53935;
    --link-bg: #eef6ff; --link-border: #b8d9ff; --link-color: #1768c9;
    --note-bg: #fff9e6; --note-border: #f0d060; --note-color: #9a7b00;
    --wa: #25d366; --star: #f5c518; --radius: 14px;
  }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }

  header { background: var(--accent); color: #fff; padding: 22px 20px 18px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 1.3rem; font-weight: 700; }
  .badge { background: #ffffff30; border-radius: 20px; padding: 3px 12px; font-size: 0.78rem; font-weight: 600; }

  .action-bar { display: flex; gap: 8px; margin: 12px 16px 0; }
  .action-bar button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--white); border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 6px; font-family: 'Inter', sans-serif; font-size: 0.78rem; font-weight: 600; color: #333; cursor: pointer; }
  .action-bar .wa-all { background: var(--wa); border-color: var(--wa); color: #fff; }

  .type-switch { display: flex; margin: 10px 16px 0; background: var(--white); border-radius: 12px; padding: 4px; gap: 4px; box-shadow: 0 2px 8px #0000000a; }
  .type-btn { flex: 1; padding: 10px; border: none; border-radius: 9px; font-family: 'Inter', sans-serif; font-size: 0.88rem; font-weight: 600; cursor: pointer; background: transparent; color: var(--muted); transition: all 0.15s; }
  .type-btn.active.link-active { background: var(--link-color); color: #fff; }
  .type-btn.active.note-active { background: var(--note-color); color: #fff; }

  .add-box { background: var(--white); margin: 10px 16px 0; border-radius: var(--radius); padding: 16px; box-shadow: 0 2px 8px #0000000a; display: flex; flex-direction: column; gap: 10px; }
  .add-box input, .add-box select { width: 100%; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-size: 0.95rem; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.2s; }
  .add-box input:focus, .add-box select:focus { border-color: var(--accent); background: #fff; }
  .add-box input::placeholder { color: #bbb; }
  .row { display: flex; gap: 8px; }
  .row select { flex: 1; }
  .btn-save { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 12px 20px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.95rem; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .newcat-toggle { background: none; border: none; color: var(--accent); font-size: 0.82rem; font-family: 'Inter', sans-serif; cursor: pointer; text-align: left; padding: 0; font-weight: 500; }
  .newcat-row { display: flex; gap: 8px; }
  .newcat-row input { flex: 1; }
  .btn-create { background: var(--accent-light); color: var(--accent); border: none; border-radius: 10px; padding: 10px 16px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.85rem; cursor: pointer; }

  /* EDITOR DE TEXTO */
  .editor-toolbar { display: flex; gap: 4px; flex-wrap: wrap; background: var(--bg); border: 1.5px solid var(--border); border-bottom: none; border-radius: 10px 10px 0 0; padding: 6px 8px; }
  .tb-btn { background: var(--white); border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px; font-size: 0.85rem; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600; color: var(--text); transition: all 0.15s; line-height: 1; }
  .tb-btn:active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tb-sep { width: 1px; background: var(--border); margin: 3px 2px; }
  .editor-area { min-height: 90px; background: var(--bg); border: 1.5px solid var(--border); border-top: none; border-radius: 0 0 10px 10px; padding: 12px 14px; font-size: 0.95rem; font-family: 'Inter', sans-serif; color: var(--text); outline: none; line-height: 1.6; }
  .editor-area:empty:before { content: attr(data-placeholder); color: #bbb; pointer-events: none; }
  .editor-area:focus { border-color: var(--accent); background: #fff; }
  .editor-area ul, .editor-area ol { padding-left: 20px; }
  .editor-area b, .editor-area strong { font-weight: 700; }
  .editor-area i, .editor-area em { font-style: italic; }
  .mic-row { display: flex; align-items: center; gap: 8px; }
  .btn-mic { background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 1rem; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .btn-mic.recording { background: #fde8e8; border-color: var(--danger); color: var(--danger); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

  /* ── MENSAGEM DO DIA ─────────────────────────────────── */
  .msg-day { margin: 10px 16px 0; background: linear-gradient(135deg,#667eea,#764ba2); border-radius: 14px; padding: 14px 18px; color: #fff; display: flex; align-items: flex-start; gap: 12px; box-shadow: 0 4px 20px #764ba240; }
  .msg-day-icon { font-size: 1.6rem; flex-shrink: 0; margin-top: 2px; }
  .msg-day-body { flex: 1; }
  .msg-day-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.75; margin-bottom: 4px; font-weight: 600; }
  .msg-day-text { font-size: 0.92rem; line-height: 1.55; font-weight: 500; font-style: italic; }
  .msg-day-author { font-size: 0.7rem; opacity: 0.65; margin-top: 6px; text-align: right; }
  @keyframes fadeInMsg { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  .msg-day { animation: fadeInMsg 0.6s ease; }


  /* ── WIDGET CLIMA + CÂMBIO ───────────────────────────── */
  .info-bar { background: linear-gradient(135deg,#1a1a2e,#16213e); color:#fff; padding: 10px 16px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .info-bar::-webkit-scrollbar { display: none; }
  .info-chip { flex-shrink: 0; background: #ffffff15; border-radius: 10px; padding: 7px 12px; display: flex; flex-direction: column; align-items: center; min-width: 72px; gap: 1px; }
  .info-chip .ic-label { font-size: 0.6rem; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
  .info-chip .ic-val { font-size: 1rem; font-weight: 700; letter-spacing: -0.5px; }
  .info-chip .ic-trend { font-size: 0.72rem; font-weight: 700; }
  .trend-up   { color: #2ecc71; }
  .trend-down { color: #ff6b6b; }
  .trend-neu  { color: #aaa; }
  .info-chip .ic-sub { font-size: 0.6rem; color: #888; margin-top: 1px; }
  .info-offline { font-size: 0.58rem; color: #666; text-align:center; padding: 2px 16px 6px; background: linear-gradient(135deg,#1a1a2e,#16213e); }


  /* ── SUBCATEGORIAS ───────────────────────────────────── */
  .subcat-group { margin-bottom: 6px; }
  .subcat-header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--accent); color: #fff; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 0.85rem; user-select: none; }
  .subcat-header .arrow { transition: transform 0.2s; font-size: 0.7rem; }
  .subcat-header.collapsed .arrow { transform: rotate(-90deg); }
  .subcat-body { display: flex; flex-direction: column; gap: 6px; padding: 6px 0 0 12px; }
  .subcat-body.hidden { display: none; }
  .subcat-tag { font-size: 0.65rem; background: #ffffff25; color: #fff; border-radius: 20px; padding: 1px 7px; font-weight: 600; }
  .subcat-select-wrap { display: flex; gap: 6px; }
  .subcat-select-wrap select { flex: 1; }
  .subcat-select-wrap select:last-child { flex: 0.7; }


  /* ── CALCULADORA FLUTUANTE ───────────────────────────── */
  .fab-calc { position: fixed; bottom: 24px; right: 20px; background: var(--accent); color: #fff; border: none; border-radius: 50%; width: 56px; height: 56px; font-size: 1.5rem; cursor: pointer; box-shadow: 0 4px 20px #5b4ef560; z-index: 200; display: flex; align-items: center; justify-content: center; transition: transform 0.15s; }
  .fab-calc:active { transform: scale(0.92); }
  .calc-panel { position: fixed; bottom: 90px; right: 16px; width: 300px; background: #1e1e2e; border-radius: 20px; box-shadow: 0 8px 40px #0006; z-index: 199; overflow: hidden; display: none; }
  .calc-panel.open { display: block; }
  .calc-screen { background: #13131f; padding: 18px 20px 10px; text-align: right; }
  .calc-expr { font-size: 0.8rem; color: #888; min-height: 18px; letter-spacing: 0.5px; margin-bottom: 4px; word-break: break-all; }
  .calc-display { font-size: 2.2rem; color: #fff; font-weight: 300; letter-spacing: -1px; word-break: break-all; min-height: 48px; }
  .calc-copy { background: none; border: none; color: #7c6ef7; font-size: 0.75rem; font-weight: 700; cursor: pointer; padding: 4px 0 8px; font-family: 'Inter',sans-serif; float: left; }
  .calc-copy:active { color: #fff; }
  .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: #0003; }
  .calc-btn { background: #2a2a3e; color: #fff; border: none; padding: 18px 0; font-size: 1.1rem; font-family: 'Inter',sans-serif; font-weight: 500; cursor: pointer; transition: background 0.1s; }
  .calc-btn:active { background: #5b4ef5; }
  .calc-btn.op  { background: #3a2a5e; color: #b8a8ff; font-weight: 700; }
  .calc-btn.op:active { background: #5b4ef5; color: #fff; }
  .calc-btn.eq  { background: #5b4ef5; color: #fff; font-weight: 700; font-size: 1.3rem; }
  .calc-btn.eq:active { background: #4a3fd4; }
  .calc-btn.ac  { background: #3e1e1e; color: #ff7070; font-weight: 700; }
  .calc-btn.ac:active { background: #e53935; color: #fff; }
  .calc-btn.zero { grid-column: span 2; }
  .calc-result-toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #1a8a3a; color: #fff; padding: 10px 24px; border-radius: 20px; font-size: 0.88rem; font-weight: 600; z-index: 300; display: none; font-family: 'Inter',sans-serif; }


  /* ── LEMBRANÇAS ─────────────────────────────────────── */
  .rem-card { border-radius: var(--radius); padding: 14px 16px; margin-bottom: 0; box-shadow: 0 2px 8px #0000001a; position: relative; transition: opacity 0.3s; }
  .rem-card.green  { background: #e8faf0; border: 2px solid #2ecc71; }
  .rem-card.yellow { background: #fffbe6; border: 2px solid #f1c40f; }
  .rem-card.red    { background: #fdecea; border: 2px solid #e53935; }
  .rem-card.expired{ background: #f0f0f0; border: 2px solid #aaa; opacity: 0.6; }
  .rem-card.blink-red    { animation: blinkRed 1s infinite; }
  .rem-card.blink-yellow { animation: blinkYellow 1.5s infinite; }
  @keyframes blinkRed    { 0%,100%{opacity:1} 50%{opacity:0.35} }
  @keyframes blinkYellow { 0%,100%{opacity:1} 50%{opacity:0.45} }
  .rem-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
  .rem-dot.green  { background: #2ecc71; }
  .rem-dot.yellow { background: #f1c40f; }
  .rem-dot.red    { background: #e53935; }
  .rem-dot.expired{ background: #aaa; }
  .rem-title { font-size: 0.95rem; font-weight: 700; flex: 1; }
  .rem-date  { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
  .rem-days  { font-size: 0.75rem; font-weight: 700; margin-top: 4px; }
  .rem-days.green  { color: #1a8a3a; }
  .rem-days.yellow { color: #9a7000; }
  .rem-days.red    { color: var(--danger); }
  .rem-days.expired{ color: #888; }
  .rem-header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .rem-actions { display: flex; gap: 8px; margin-top: 10px; }
  .btn-rem-del { background: #fde8e8; color: var(--danger); border: none; border-radius: 8px; padding: 6px 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: 'Inter',sans-serif; }
  .btn-rem-done { background: #e8faf0; color: #1a8a3a; border: none; border-radius: 8px; padding: 6px 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: 'Inter',sans-serif; }
  .rem-form label { font-size: 0.78rem; color: var(--muted); font-weight: 600; margin-bottom: 3px; display: block; }
  .rem-form input[type=text], .rem-form input[type=datetime-local], .rem-form input[type=number], .rem-form textarea { width: 100%; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 14px; color: var(--text); font-size: 0.92rem; font-family: 'Inter',sans-serif; outline: none; }
  .rem-form input:focus, .rem-form textarea:focus { border-color: var(--accent); background: #fff; }
  .blink-opts { display: flex; gap: 6px; flex-wrap: wrap; }
  .blink-opt { padding: 6px 12px; border-radius: 20px; border: 1.5px solid var(--border); font-size: 0.8rem; font-weight: 600; cursor: pointer; background: var(--white); color: var(--muted); font-family: 'Inter',sans-serif; }
  .blink-opt.sel { background: var(--accent); border-color: var(--accent); color: #fff; }


  /* TABS */
  .tabs-wrap { display: flex; align-items: center; gap: 8px; padding: 14px 16px 0; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: 1; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex-shrink: 0; padding: 6px 16px; border-radius: 20px; font-size: 0.82rem; font-weight: 600; cursor: pointer; border: 1.5px solid var(--border); background: var(--white); color: var(--muted); transition: all 0.15s; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-manage-cats { flex-shrink: 0; background: none; border: none; font-size: 1.1rem; cursor: pointer; padding: 4px 6px; }

  .manage-panel { display: none; margin: 10px 16px 0; background: var(--white); border-radius: var(--radius); padding: 14px 16px; box-shadow: 0 2px 8px #0000000a; }
  .manage-panel.open { display: block; }
  .manage-panel h3 { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .manage-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--bg); font-size: 0.9rem; }
  .manage-row:last-child { border-bottom: none; }
  .manage-del { background: #fde8e8; color: var(--danger); border: none; border-radius: 8px; padding: 5px 12px; font-size: 0.78rem; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }

  .items-list { padding: 10px 16px 0; display: flex; flex-direction: column; gap: 8px; }

  /* LINK CARD */
  .link-card { background: var(--link-bg); border: 1.5px solid var(--link-border); border-radius: var(--radius); padding: 12px; display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 4px #0000000a; }
  .link-card.starred { border-color: var(--star); }
  .favicon { width: 32px; height: 32px; border-radius: 8px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; flex-shrink: 0; overflow: hidden; }
  .favicon img { width: 20px; height: 20px; object-fit: contain; }
  .link-info { flex: 1; min-width: 0; }
  .link-name { font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--link-color); }
  .link-domain { font-size: 0.72rem; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* NOTE CARD */
  .note-card { background: var(--note-bg); border: 1.5px solid var(--note-border); border-radius: var(--radius); padding: 14px; box-shadow: 0 1px 4px #0000000a; }
  .note-card.starred { border-color: var(--star); }
  .note-header { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .note-icon { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }
  .note-title { font-size: 0.88rem; font-weight: 700; flex: 1; color: var(--note-color); }
  .note-body { font-size: 0.85rem; color: #5c4a00; line-height: 1.6; word-break: break-word; }
  .note-body ul, .note-body ol { padding-left: 18px; }
  .note-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }

  /* SHARED BUTTONS */
  .cat-tag { font-size: 0.7rem; background: #ffffffb0; color: #555; border-radius: 20px; padding: 2px 9px; font-weight: 600; flex-shrink: 0; white-space: nowrap; }
  .btn-open { background: var(--link-color); color: #fff; border: none; border-radius: 8px; padding: 6px 10px; font-size: 0.78rem; font-family: 'Inter', sans-serif; font-weight: 600; cursor: pointer; flex-shrink: 0; }
  .btn-wa { background: var(--wa); color: #fff; border: none; border-radius: 8px; padding: 6px 8px; font-size: 0.85rem; cursor: pointer; flex-shrink: 0; font-family: 'Inter', sans-serif; font-weight: 600; }
  .btn-edit { background: none; border: none; color: #999; cursor: pointer; font-size: 0.9rem; padding: 3px; flex-shrink: 0; }
  .btn-del { background: none; border: none; color: #ccc; cursor: pointer; font-size: 0.95rem; padding: 3px; flex-shrink: 0; }
  .btn-star { background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 2px; flex-shrink: 0; opacity: 0.25; transition: opacity 0.15s; }
  .btn-sum { background: #f0f0ff; color: var(--accent); border: 1.5px solid var(--accent-light); border-radius: 8px; padding: 6px 10px; font-size: 0.82rem; cursor: pointer; flex-shrink: 0; font-family: "Inter",sans-serif; font-weight: 600; }
  .sum-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--bg); font-size: 0.9rem; }
  .merge-item { padding: 5px 10px; border-radius: 8px; font-size: 0.88rem; margin: 3px 0; line-height: 1.5; }
  .merge-item.dup  { background: #fde8e8; color: #b71c1c; font-weight: 700; border-left: 4px solid #e53935; }
  .merge-item.only1 { background: #eef6ff; color: #1768c9; border-left: 4px solid #1768c9; }
  .merge-item.only2 { background: #e8faf0; color: #1a8a3a; border-left: 4px solid #2ecc71; }
  .merge-legend { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; font-size: 0.75rem; font-weight: 600; }
  .merge-legend span { padding: 3px 10px; border-radius: 20px; }
  .sum-row:last-child { border-bottom: none; }
  .sum-positive { color: #1a8a3a; font-weight: 700; }
  .sum-negative { color: var(--danger); font-weight: 700; }
  .sum-total { font-size: 1.1rem; font-weight: 800; padding: 12px 0 0; text-align: right; }
  .btn-star.on { opacity: 1; }
  .section-label { font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; padding: 6px 2px 2px; }
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 0.9rem; line-height: 1.7; }

  /* MODAL */
  .overlay { display: none; position: fixed; inset: 0; background: #000a; z-index: 100; align-items: flex-end; justify-content: center; }
  .overlay.open { display: flex; }
  .modal { background: var(--white); border-radius: 18px 18px 0 0; width: 100%; max-width: 520px; padding: 20px 16px 28px; display: flex; flex-direction: column; gap: 10px; max-height: 88vh; overflow-y: auto; }
  .modal h2 { font-size: 1.05rem; font-weight: 700; }
  .modal input, .modal select { width: 100%; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-size: 0.95rem; font-family: 'Inter', sans-serif; outline: none; }
  .modal input:focus, .modal select:focus { border-color: var(--accent); }
  .modal-btns { display: flex; gap: 10px; }
  .btn-primary { flex: 1; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 13px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.92rem; cursor: pointer; }
  .btn-cancel { flex: 1; background: var(--bg); color: var(--text); border: none; border-radius: 10px; padding: 13px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.92rem; cursor: pointer; }
</style>
</head>
<body>

<header>
  <div>
    <h1>📋 As Minhas Notas</h1>
    <div style="font-size:0.72rem;opacity:0.75;margin-top:2px">por Gerardo Pizo</div>
  </div>
  <span class="badge" id="total-count">0 itens</span>
</header>

<!-- INFO BAR: CLIMA + CÂMBIO -->
<div class="info-bar" id="info-bar">
  <div class="info-chip"><span class="ic-label">🌡 Temp</span><span class="ic-val" id="iw-temp">--</span><span class="ic-sub" id="iw-city">--</span></div>
  <div class="info-chip"><span class="ic-label">💧 Humidade</span><span class="ic-val" id="iw-hum">--</span><span class="ic-sub">Relativa</span></div>
  <div class="info-chip"><span class="ic-label">🌧 Chuva hoje</span><span class="ic-val" id="iw-rain">--</span><span class="ic-sub" id="iw-rain-sub">chance</span></div>
  <div class="info-chip"><span class="ic-label">🇧🇷→🇨🇴 BRL/COP</span><span class="ic-val" id="iw-brl-cop">--</span><span class="ic-trend" id="iw-brl-cop-t">--</span></div>

<script>
  // ── MIGRAÇÃO ───────────────────────────────────────────
  function loadData() {
    var key = 'meus-items-v3';
    var oldKeys = ['meus-items-v2', 'meus-items-v1', 'meus-links-v2', 'meus-links'];
    var current = JSON.parse(localStorage.getItem(key) || 'null');
    if (current && current.items && current.items.length) return current;
    for (var k = 0; k < oldKeys.length; k++) {
      var old = JSON.parse(localStorage.getItem(oldKeys[k]) || 'null');
      if (old && old.items && old.items.length) {
        var cats = old.categories || ['Geral'];
        var migrated = {
          categories: cats.map(function(c) {
            if (typeof c === 'string') return {name: c, subs: []};
            return c;
          }),
          items: old.items.map(function(i) {
            return { id: i.id || Date.now(), type: i.type || 'link', url: i.url || '', title: i.title || '', html: i.html || '', text: i.text || '', cat: i.cat || 'Geral', subcat: i.subcat || '', starred: !!i.starred };
          })
        };
        localStorage.setItem(key, JSON.stringify(migrated));
        return migrated;
      }
    }
    return {
      categories: [
        {name:'Geral', subs:[]},
        {name:'Trabalho', subs:['Projetos','Reuniões']},
        {name:'Pessoal', subs:['Família','Saúde']}
      ],
      items: [
        { id: 1, type: 'link', url: 'https://google.com', cat: 'Geral', subcat: '', starred: false },
        { id: 2, type: 'link', url: 'https://youtube.com', cat: 'Geral', subcat: '', starred: false },
        { id: 3, type: 'note', title: 'Exemplo de nota', html: '<ul><li>✅ Tarefa feita</li><li>📌 Ponto importante</li></ul>', text: '✅ Tarefa feita\n📌 Ponto importante', cat: 'Pessoal', subcat: 'Família', starred: true }
      ]
    };
  }

  var data = loadData();
  var activeTab = 'Todos';
  var currentType = 'link';
  var editingId = null;

  function save() { localStorage.setItem('meus-items-v3', JSON.stringify(data)); }
  function getDomain(url) { try { return new URL(url).hostname.replace('www.', ''); } catch { return url; } }
  function getFavicon(url) { try { return 'https://www.google.com/s2/favicons?domain=' + new URL(url).hostname + '&sz=64'; } catch { return null; } }
  function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // ── EDITOR ────────────────────────────────────────────
  function fmt(cmd, val) {
    document.getElementById('f-note-text').focus();
    document.execCommand(cmd, false, val || null);
  }
  function insertText(t) {
    document.getElementById('f-note-text').focus();
    document.execCommand('insertText', false, t);
  }

  // ── HTML → WhatsApp texto ─────────────────────────────
  function htmlToWA(html) {
    var tmp = document.createElement('div');
    tmp.innerHTML = html;
    function walk(node) {
      var out = '';
      node.childNodes.forEach(function(n) {
        if (n.nodeType === 3) { out += n.textContent; return; }
        var tag = n.tagName ? n.tagName.toLowerCase() : '';
        if (tag === 'b' || tag === 'strong') out += '*' + walk(n) + '*';
        else if (tag === 'i' || tag === 'em') out += '_' + walk(n) + '_';
        else if (tag === 'h3' || tag === 'h2') out += '*' + walk(n).toUpperCase() + '*\n';
        else if (tag === 'li') out += '• ' + walk(n) + '\n';
        else if (tag === 'br') out += '\n';
        else if (tag === 'p' || tag === 'div') out += walk(n) + '\n';
        else out += walk(n);
      });
      return out;
    }
    return walk(tmp).replace(/\n{3,}/g, '\n\n').trim();
  }

  // ── TYPE SWITCH ────────────────────────────────────────
  function setType(t) {
    currentType = t;
    document.getElementById('form-link').style.display = t === 'link' ? 'flex' : 'none';
    document.getElementById('form-note').style.display = t === 'note' ? 'flex' : 'none';
    document.getElementById('form-rem').style.display  = t === 'rem'  ? 'flex' : 'none';
    document.getElementById('rem-list').style.display  = t === 'rem'  ? 'flex' : 'none';
    document.getElementById('tabs-wrap-main').style.display = t === 'rem' ? 'none' : 'flex';
    document.getElementById('items-list').style.display = t === 'rem' ? 'none' : 'flex';
    document.getElementById('manage-panel').style.display = 'none';
    document.getElementById('btn-link').className = 'type-btn' + (t === 'link' ? ' active link-active' : '');
    document.getElementById('btn-note').className = 'type-btn' + (t === 'note' ? ' active note-active' : '');
    document.getElementById('btn-rem').className  = 'type-btn' + (t === 'rem'  ? ' active' : '');
    document.getElementById('btn-rem').style.background = t === 'rem' ? '#e53935' : '';
    document.getElementById('btn-rem').style.color = t === 'rem' ? '#fff' : '';
    if (t === 'rem') renderReminders();
    else renderSelects();
  }

  // ── RENDER ────────────────────────────────────────────
  function render() { renderSelects(); renderTabs(); renderItems(); renderManagePanel(); updateCount(); }

  function catNames() { return data.categories.map(function(c){ return typeof c==='string'?c:c.name; }); }
  function catObj(name) { return data.categories.find(function(c){ return (typeof c==='string'?c:c.name)===name; }); }

  function renderSelects() {
    ['link','note'].forEach(function(t) {
      var sel = document.getElementById('f-cat-' + t);
      var cur = sel.value;
      var names = catNames();
      sel.innerHTML = names.map(function(n){ return '<option value="'+esc(n)+'">'+n+'</option>'; }).join('');
      if (names.includes(cur)) sel.value = cur;
      else if (activeTab !== 'Todos' && activeTab !== '★' && names.includes(activeTab)) sel.value = activeTab;
      updateSubcatSelect(t);
      // also update parent selects for new subcat
      var ps = document.getElementById('f-newcat-parent-' + t);
      if (ps) ps.innerHTML = names.map(function(n){ return '<option value="'+esc(n)+'">'+n+'</option>'; }).join('');
    });
  }

  function updateSubcatSelect(t) {
    var catSel = document.getElementById('f-cat-' + t);
    var subSel = document.getElementById('f-subcat-' + t);
    if (!catSel || !subSel) return;
    var catName = catSel.value;
    var cat = catObj(catName);
    var subs = (cat && cat.subs) ? cat.subs : [];
    subSel.innerHTML = '<option value="">— Subcategoria —</option>' + subs.map(function(s){ return '<option value="'+esc(s)+'">'+s+'</option>'; }).join('');
  }

  function renderTabs() {
    var el = document.getElementById('tabs');
    var sc = data.items.filter(function(i){ return i.starred; }).length;
    var h = '<button class="tab '+(activeTab==='Todos'?'active':'')+'" onclick="setTab(\'Todos\')">Todos ('+data.items.length+')</button>';
    if (sc) h += '<button class="tab '+(activeTab==='★'?'active':'')+'" onclick="setTab(\'★\')">⭐ Favoritos ('+sc+')</button>';
    data.categories.forEach(function(cat) {
      var name = typeof cat==='string' ? cat : cat.name;
      var n = data.items.filter(function(i){ return i.cat===name; }).length;
      h += '<button class="tab '+(activeTab===name?'active':'')+'" onclick="setTab(\''+esc(name)+'\')">'+name+' ('+n+')</button>';
    });
    el.innerHTML = h;
  }

  function renderManagePanel() {
    var el = document.getElementById('manage-list');
    if (!data.categories.length) { el.innerHTML = '<p style="color:var(--muted);font-size:0.85rem">Sem categorias.</p>'; return; }
    el.innerHTML = data.categories.map(function(cat) {
      var name = typeof cat==='string' ? cat : cat.name;
      var subs = (cat && cat.subs) ? cat.subs : [];
      var n = data.items.filter(function(i){ return i.cat===name; }).length;
      var subsHtml = subs.map(function(s){
        var ns = data.items.filter(function(i){ return i.cat===name && i.subcat===s; }).length;
        return '<div class="manage-row" style="padding-left:16px;font-size:0.85rem"><span>↳ '+s+' <span style="color:var(--muted);font-size:0.78rem">('+ns+' item'+(ns!==1?'s':'')+')</span></span><button class="manage-del" onclick="delSubcat(\''+esc(name)+'\',\''+esc(s)+'\')">✕ sub.</button></div>';
      }).join('');
      return '<div class="manage-row"><span>📁 '+name+' <span style="color:var(--muted);font-size:0.8rem">('+n+' item'+(n!==1?'s':'')+')</span></span><button class="manage-del" onclick="delCat(\''+esc(name)+'\')">Apagar</button></div>'+subsHtml;
    }).join('');
  }


  function cardHtml(item) {
    if (item.type === 'link') {
      var fav = getFavicon(item.url);
      var favHtml = fav ? '<img src="' + fav + '" onerror="this.parentElement.textContent=\'🔗\'">' : '🔗';
      var short = item.url.length > 34 ? item.url.slice(0,34) + '…' : item.url;
      return '<div class="link-card ' + (item.starred?'starred':'') + '">'
        + '<button class="btn-star ' + (item.starred?'on':'') + '" onclick="toggleStar(' + item.id + ')">⭐</button>'
        + '<div class="favicon">' + favHtml + '</div>'
        + '<div class="link-info"><div class="link-name">' + getDomain(item.url) + '</div><div class="link-domain">' + short + '</div></div>'
        + '<span class="cat-tag">' + item.cat + (item.subcat ? ' › '+item.subcat : '') + '</span>'
        + '<button class="btn-open" onclick="window.open(\'' + item.url + '\',\'_blank\',\'noopener\')">Abrir</button>'
        + '<button class="btn-wa" onclick="shareWALink(\'' + esc(item.url) + '\',\'' + esc(getDomain(item.url)) + '\',\'' + esc(item.cat) + '\')">🟢</button>'
        + '<button class="btn-edit" onclick="openEdit(' + item.id + ')">✏️</button>'
        + '<button class="btn-del" onclick="delItem(' + item.id + ')">✕</button>'
        + '</div>';
    } else {
      var bodyHtml = item.html || esc(item.text || '').replace(/\n/g,'<br>');
      return '<div class="note-card ' + (item.starred?'starred':'') + '">'
        + '<div class="note-header">'
        + '<button class="btn-star ' + (item.starred?'on':'') + '" onclick="toggleStar(' + item.id + ')">⭐</button>'
        + '<span class="note-icon">📝</span>'
        + '<span class="note-title">' + esc(item.title||'Nota') + '</span>'
        + '<button class="btn-edit" onclick="openEdit(' + item.id + ')">✏️</button>'
        + '<button class="btn-del" onclick="delItem(' + item.id + ')">✕</button>'
        + '</div>'
        + '<div class="note-body">' + bodyHtml + '</div>'
        + '<div class="note-footer">'
        + '<span class="cat-tag">' + item.cat + (item.subcat ? ' › '+item.subcat : '') + '</span>'
        + '<button class="btn-wa" onclick="shareWANote(' + item.id + ')">🟢 Partilhar</button>'
        + '<button class="btn-sum" onclick="sumNote(' + item.id + ')">🔢 Somar</button>'
        + '</div></div>';
    }
  }

  function renderItems() {
    var list = activeTab==='Todos' ? data.items.slice()
      : activeTab==='★' ? data.items.filter(function(i){return i.starred;})
      : data.items.filter(function(i){return i.cat===activeTab;});

    var el = document.getElementById('items-list');
    if (!list.length) { el.innerHTML = '<div class="empty"><div style="font-size:2rem;margin-bottom:10px">✨</div>Sem itens aqui.<br>Adiciona um link ou texto acima!</div>'; return; }

    var starred = list.filter(function(i){return i.starred;}).reverse();
    var normal  = list.filter(function(i){return !i.starred;}).reverse();
    var h = '';

    if (starred.length) {
      h += '<div class="section-label">⭐ Favoritos</div>';
      h += starred.map(cardHtml).join('');
    }

    // If inside a category tab, group by subcategory
    if (activeTab !== 'Todos' && activeTab !== '★') {
      var cat = catObj(activeTab);
      var subs = (cat && cat.subs && cat.subs.length) ? cat.subs : [];
      if (subs.length) {
        // Items with no subcat
        var noSub = normal.filter(function(i){ return !i.subcat; });
        if (noSub.length) {
          h += '<div class="section-label">📁 Sem subcategoria</div>';
          h += noSub.map(cardHtml).join('');
        }
        subs.forEach(function(s) {
          var subItems = normal.filter(function(i){ return i.subcat===s; });
          if (!subItems.length) return;
          var sid = 'sg_'+s.replace(/\W/g,'_');
          h += '<div class="subcat-group">'
            + '<div class="subcat-header" onclick="toggleSubcatGroup(\''+sid+'\')">'
            + '<span class="arrow">▼</span> 📂 '+s
            + '<span class="subcat-tag">'+subItems.length+'</span>'
            + '</div>'
            + '<div class="subcat-body" id="'+sid+'">'
            + subItems.map(cardHtml).join('')
            + '</div></div>';
        });
        el.innerHTML = h;
        return;
      }
    }

    if (normal.length) {
      if (starred.length) h += '<div class="section-label">Restantes</div>';
      h += normal.map(cardHtml).join('');
    }
    el.innerHTML = h;
  }

  function toggleSubcatGroup(id) {
    var body = document.getElementById(id);
    var header = body ? body.previousElementSibling : null;
    if (!body) return;
    body.classList.toggle('hidden');
    if (header) header.classList.toggle('collapsed');
  }

  function updateCount() {
    document.getElementById('total-count').textContent = data.items.length + ' item' + (data.items.length!==1?'s':'');
  }

  function setTab(t) { activeTab = t; render(); }
  function toggleManagePanel() { document.getElementById('manage-panel').classList.toggle('open'); }
  function toggleStar(id) { var item = data.items.find(function(i){return i.id===id;}); if(item){item.starred=!item.starred;save();render();} }

  // ── SAVE LINK ─────────────────────────────────────────
  function saveLink() {
    var inp = document.getElementById('f-url');
    var url = inp.value.trim();
    if (!url || !url.startsWith('http')) { inp.style.borderColor='#e53935'; inp.focus(); setTimeout(function(){inp.style.borderColor='';},1000); return; }
    var cat = document.getElementById('f-cat-link').value;
    var subcat = document.getElementById('f-subcat-link').value;
    data.items.push({ id: Date.now(), type: 'link', url: url, cat: cat, subcat: subcat, starred: false });

      + '<input type="text" id="merge-title" placeholder="Título da nota resultado…" style="width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;font-family:Inter,sans-serif;font-size:0.9rem;outline:none;margin-top:2px">'
      + '<div class="modal-btns" style="position:sticky;bottom:0;background:var(--white);padding-top:8px">'
      + '<button class="btn-cancel" onclick="closeModal()">Cancelar</button>'

      + '</div>';

    document.getElementById('modal-content').innerHTML = h;
    document.getElementById('overlay').classList.add('open');
  }

  function extractLines(item) {
    var tmp = document.createElement('div');
    tmp.innerHTML = item.html || item.text || '';
    // Get lines from li elements first, then split by newlines
    var lines = [];
    var liEls = tmp.querySelectorAll('li');
    if (liEls.length) {
      liEls.forEach(function(li){ var t = li.textContent.trim(); if(t) lines.push(t); });
    } else {
      var txt = (tmp.textContent || tmp.innerText || '').trim();
      lines = txt.split("\n").map(function(l){ return l.trim(); }).filter(function(l){ return l.length > 0; });
    }
    return lines;
  }

  function normalize(s) { return s.toLowerCase().replace(/[^a-z0-9À-ɏ]/gi,'').trim(); }

  function doMerge() {
    var idA = parseInt(document.getElementById('merge-a').value);
    var idB = parseInt(document.getElementById('merge-b').value);
    if (idA === idB) { alert('Escolhe duas notas diferentes!'); return; }

    var noteA = data.items.find(function(i){ return i.id === idA; });
    var noteB = data.items.find(function(i){ return i.id === idB; });
    if (!noteA || !noteB) return;

    var linesA = extractLines(noteA);
    var linesB = extractLines(noteB);
    var normA  = linesA.map(normalize);
    var normB  = linesB.map(normalize);

    // Find duplicates
    var dupsA = linesA.filter(function(l,i){ return normB.includes(normA[i]); });
    var dupsB = linesB.filter(function(l,i){ return normA.includes(normB[i]); });
    var dupSet = normA.filter(function(n){ return normB.includes(n); });

    // Build merged list: all unique from A, then unique from B, then duplicates
    var onlyA = linesA.filter(function(l,i){ return !dupSet.includes(normA[i]); });
    var onlyB = linesB.filter(function(l,i){ return !dupSet.includes(normB[i]); });
    var dups  = linesA.filter(function(l,i){ return dupSet.includes(normA[i]); });

    // Build HTML result
    var title = document.getElementById('merge-title').value.trim() || 'Lista combinada — ' + (noteA.title||'Lista 1') + ' + ' + (noteB.title||'Lista 2');
    var cat = noteA.cat || data.categories[0];

    var legend = '<div class="merge-legend">'
      + '<span style="background:#eef6ff;color:#1768c9">🔵 Só em ' + (noteA.title||'Lista 1') + '</span>'
      + '<span style="background:#e8faf0;color:#1a8a3a">🟢 Só em ' + (noteB.title||'Lista 2') + '</span>'
      + '<span style="background:#fde8e8;color:#b71c1c">🔴 Repetido nas duas</span>'
      + '</div>';

    var resultHtml = legend;
    resultHtml += '<ul>';
    onlyA.forEach(function(l){ resultHtml += '<li style="color:#1768c9">🔵 ' + l + '</li>'; });
    onlyB.forEach(function(l){ resultHtml += '<li style="color:#1a8a3a">🟢 ' + l + '</li>'; });
    dups.forEach(function(l){  resultHtml += '<li style="color:#b71c1c;font-weight:700">🔴 ' + l + ' ⚠️ repetido</li>'; });
    resultHtml += '</ul>';

    var plainText = '';
    onlyA.forEach(function(l){ plainText += '🔵 ' + l + '\n'; });
    onlyB.forEach(function(l){ plainText += '🟢 ' + l + '\n'; });
    dups.forEach(function(l){  plainText += '🔴 ' + l + ' ⚠️ repetido\n'; });

    // Show result in modal before saving
    var stats = dups.length + ' repetido(s) | ' + onlyA.length + ' só em lista 1 | ' + onlyB.length + ' só em lista 2';

    var h2 = '<h2>🔀 Resultado da comparação</h2>'
      + '<p style="font-size:0.8rem;font-weight:600;color:var(--muted);margin-bottom:6px">' + stats + '</p>'
      + '<div style="max-height:300px;overflow-y:auto;background:var(--bg);border-radius:10px;padding:10px 14px;font-size:0.85rem;line-height:1.8">'
      + resultHtml
      + '</div>'
      + '<div class="modal-btns" style="position:sticky;bottom:0;background:var(--white);padding-top:8px">'
      + '<button class="btn-cancel" onclick="closeModal()">Fechar</button>'
      + '<button class="btn-primary" onclick="saveMergeNote(' + JSON.stringify(title).replace(/'/g,"&#39;") + ',' + JSON.stringify(resultHtml).replace(/'/g,"&#39;") + ',' + JSON.stringify(plainText).replace(/'/g,"&#39;") + ',' + JSON.stringify(cat).replace(/'/g,"&#39;") + ')">💾 Guardar como nota</button>'
      + '</div>';

    document.getElementById('modal-content').innerHTML = h2;
  }

  function saveMergeNote(title, html, text, cat) {

  // ── SOMAR NÚMEROS ─────────────────────────────────────
  function sumNote(id) {
    var item = data.items.find(function(i){ return i.id === id; });
    if (!item) return;

    var tmp = document.createElement('div');
    tmp.innerHTML = item.html || item.text || '';
    var plain = tmp.textContent || tmp.innerText || '';

    // Extract numbers: negatives, decimals with . or ,
    var regex = /-?\d+([.,]\d+)?/g;
    var raw = plain.match(regex);
    if (!raw || !raw.length) { alert('Nenhum número encontrado nesta nota.'); return; }

    var numbers = raw.map(function(m) { return parseFloat(m.replace(',','.')); });
    var total = numbers.reduce(function(a,b){ return a+b; }, 0);
    var fmt = function(n) { return Number.isInteger(n) ? String(n) : n.toFixed(2); };

    var rows = '';
    numbers.forEach(function(n) {
      var sign = n >= 0 ? '+' : '';
      var icon = n < 0 ? '➖' : '➕';
      var cls  = n < 0 ? 'sum-negative' : 'sum-positive';
      rows += '<div class="sum-row"><span class="' + cls + '">' + icon + ' ' + sign + fmt(n) + '</span></div>';
    });

    var totalCls = total < 0 ? 'sum-negative' : 'sum-positive';
    var totalStr = fmt(total);

    var h = '<h2>🔢 Soma da nota</h2>'
      + '<p style="font-size:0.8rem;color:var(--muted);margin-bottom:8px">' + numbers.length + ' número(s) encontrado(s)</p>'
      + '<div style="max-height:220px;overflow-y:auto;border:1.5px solid var(--border);border-radius:10px;padding:4px 14px;background:var(--bg)">' + rows + '</div>'
      + '<div class="sum-total">Total: <span class="' + totalCls + '">' + totalStr + '</span></div>'
      + '<div class="modal-btns" style="margin-top:10px">'
      + '<button class="btn-cancel" onclick="closeModal()">Fechar</button>'
      + '<button class="btn-primary" onclick="copySumResult(\'' + totalStr + '\')">📋 Copiar total</button>'
      + '</div>';

    document.getElementById('modal-content').innerHTML = h;
    document.getElementById('overlay').classList.add('open');
  }

  // ── CALCULADORA FLUTUANTE ─────────────────────────────
  var calcCurrent = '0';
  var calcPrev = '';
  var calcOper = null;
  var calcReset = false;

  function toggleCalc() {
    var p = document.getElementById('calc-panel');
    p.classList.toggle('open');
  }

  function calcUpdate() {
    var disp = parseFloat(calcCurrent);
    var str = isNaN(disp) ? '0' : calcCurrent;
    document.getElementById('calc-display').textContent = str;
  }

  function calcNum(n) {
    if (calcReset) { calcCurrent = n; calcReset = false; }
    else if (calcCurrent === '0') calcCurrent = n;
    else calcCurrent += n;
    calcUpdate();
  }

  function calcDot() {
    if (calcReset) { calcCurrent = '0.'; calcReset = false; return; }
    if (!calcCurrent.includes('.')) calcCurrent += '.';
    calcUpdate();
  }

  function calcOp(op) {
    if (calcOper && !calcReset) calcEq(true);
    calcPrev = calcCurrent;
    calcOper = op;
    calcReset = true;
    var opSym = op === '*' ? '×' : op === '/' ? '÷' : op;
    document.getElementById('calc-expr').textContent = calcPrev + ' ' + opSym;
  }

  function calcEq(silent) {
    if (!calcOper || !calcPrev) return;
    var a = parseFloat(calcPrev);
    var b = parseFloat(calcCurrent);
    var res;
    if (calcOper === '+') res = a + b;
    else if (calcOper === '-') res = a - b;
    else if (calcOper === '*') res = a * b;
    else if (calcOper === '/') res = b !== 0 ? a / b : 'Erro';
    var opSym = calcOper === '*' ? '×' : calcOper === '/' ? '÷' : calcOper;
    if (!silent) document.getElementById('calc-expr').textContent = calcPrev + ' ' + opSym + ' ' + calcCurrent + ' =';
    var resStr = (typeof res === 'number') ? (Number.isInteger(res) ? String(res) : parseFloat(res.toFixed(10)).toString()) : res;
    calcCurrent = resStr;
    calcOper = null;
    calcPrev = '';
    calcReset = true;
    calcUpdate();
  }

  function calcAC() {
    calcCurrent = '0'; calcPrev = ''; calcOper = null; calcReset = false;
    document.getElementById('calc-expr').textContent = '';
    calcUpdate();
  }

  function calcSign() {
    if (calcCurrent !== '0') {
      calcCurrent = calcCurrent.startsWith('-') ? calcCurrent.slice(1) : '-' + calcCurrent;
      calcUpdate();
    }
  }

  function calcPct() {
    calcCurrent = String(parseFloat(calcCurrent) / 100);
    calcUpdate();
  }

  function copyCalcResult() {
    var val = document.getElementById('calc-display').textContent;
    navigator.clipboard.writeText(val).catch(function(){});
    var toast = document.getElementById('calc-toast');
    toast.textContent = '✅ Copiado: ' + val;
    toast.style.display = 'block';
    setTimeout(function(){ toast.style.display = 'none'; }, 2000);
  }

  function remColor(r) {
    if (r.done) return 'expired';
    var now = new Date();
    var due = new Date(r.datetime);
    if (due < now) return 'expired';
    var days = (due - now) / (1000 * 60 * 60 * 24);
    if (days <= r.redDays)    return 'red';
    if (days <= r.yellowDays) return 'yellow';
    return 'green';
  }

  function remBlinkClass(r, color) {
    if (r.blink === 'none') return '';
    if (r.blink === 'always') return color === 'red' ? 'blink-red' : color === 'yellow' ? 'blink-yellow' : '';
    if (r.blink === 'red' && color === 'red') return 'blink-red';
    // auto: blink red and yellow
    if (r.blink === 'auto') {
      if (color === 'red')    return 'blink-red';
      if (color === 'yellow') return 'blink-yellow';
    }
    return '';
  }

  function remDaysLabel(r) {
    if (r.done) return 'Concluído ✅';
    var now = new Date();
    var due = new Date(r.datetime);
    if (due < now) return 'Expirado ❌';
    var diff = due - now;
    var days  = Math.floor(diff / (1000*60*60*24));
    var hours = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
    var mins  = Math.floor((diff % (1000*60*60)) / (1000*60));
    if (days > 0)  return 'Faltam ' + days + ' dia(s) e ' + hours + 'h';
    if (hours > 0) return 'Faltam ' + hours + 'h e ' + mins + 'min';
    return 'Faltam ' + mins + ' minuto(s)!';
  }

  function formatDt(dt) {
    var d = new Date(dt);
    return d.toLocaleDateString('pt-PT', {weekday:'short',day:'2-digit',month:'short',year:'numeric'}) + ' às ' + d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
  }

  function renderReminders() {
    var el = document.getElementById('rem-list');
    if (!el) return;
    el.style.display = 'flex';
    el.style.flexDirection = 'column';
    el.style.gap = '10px';

    // Sort: active first by date, done/expired last
    var active  = reminders.filter(function(r){ return !r.done && new Date(r.datetime) >= new Date(); }).sort(function(a,b){ return new Date(a.datetime)-new Date(b.datetime); });
    var expired = reminders.filter(function(r){ return r.done || new Date(r.datetime) < new Date(); });
    var sorted  = active.concat(expired);

    if (!sorted.length) {
      el.innerHTML = '<div style="text-align:center;padding:40px 20px;color:var(--muted);font-size:0.9rem;">Sem lembretes ainda.<br>Adiciona um acima! 🔔</div>';
      return;
    }

    el.innerHTML = sorted.map(function(r) {
      var color = remColor(r);
      var blink = remBlinkClass(r, color);
      var label = remDaysLabel(r);
      var btns  = r.done || new Date(r.datetime) < new Date()
        ? '<button class="btn-rem-del" onclick="delReminder(' + r.id + ')">🗑 Apagar</button>'
        : '<button class="btn-rem-done" onclick="doneReminder(' + r.id + ')">✅ Concluído</button>'
          + '<button class="btn-rem-del" onclick="delReminder(' + r.id + ')">🗑 Apagar</button>';

      var icon = color==='green' ? '🟢' : color==='yellow' ? '🟡' : color==='expired' ? '⚫' : '🔴';

      return '<div class="rem-card ' + color + ' ' + blink + '">'
        + '<div class="rem-header">'
        + '<div class="rem-dot ' + color + '"></div>'
        + '<div class="rem-title">' + icon + ' ' + r.title + '</div>'
        + '</div>'
        + (r.desc ? '<div style="font-size:0.83rem;color:#555;margin-bottom:3px">' + r.desc + '</div>' : '')
        + '<div class="rem-date">📅 ' + formatDt(r.datetime) + '</div>'
        + '<div class="rem-days ' + color + '">' + label + '</div>'
        + '<div class="rem-actions">' + btns + '</div>'
        + '</div>';
    }).join('');
  }

  // Refresh reminders every minute to update countdowns
  setInterval(function() { if (currentType === 'rem') renderReminders(); }, 60000);

  // ── VOZ ───────────────────────────────────────────────
  var recognition = null;
  var isRecording = false;

  function toggleVoice() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
      alert('O teu browser não suporta reconhecimento de voz. Usa o Chrome no Android.');
      return;
    }
    if (isRecording) { recognition.stop(); return; }
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.lang = 'pt-PT';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.onstart = function() {
      isRecording = true;
      document.getElementById('btn-mic').className = 'btn-mic recording';
      document.getElementById('btn-mic').textContent = '⏹️ Parar';
      document.getElementById('voice-status').style.display = 'inline';
    };
    recognition.onresult = function(e) {
      var t = '';
      for (var i=0;i<e.results.length;i++) t += e.results[i][0].transcript;
      document.getElementById('f-note-text').innerText = t;
    };
    recognition.onerror = function(e) { alert('Erro: ' + e.error); stopVoice(); };
    recognition.onend = function() { stopVoice(); };
    recognition.start();
  }
  function stopVoice() {
    isRecording = false;
    var btn = document.getElementById('btn-mic');
    btn.className = 'btn-mic';
    btn.textContent = '🎤 Gravar voz';
    document.getElementById('voice-status').style.display = 'none';
  }

  // ── EXPORT ────────────────────────────────────────────
  function buildText() {
    var date = new Date().toLocaleString('pt-PT');
    var txt = 'AS MINHAS NOTAS E LINKS\nExportado em: ' + date + '\n' + '='.repeat(40) + '\n\n';
    data.categories.forEach(function(cat) {
      var items = data.items.filter(function(i){return i.cat===cat;});
      if (!items.length) return;
      txt += '[ ' + cat.toUpperCase() + ' ]\n' + '─'.repeat(30) + '\n';
      items.forEach(function(i) {
        var star = i.starred ? '⭐ ' : '';
        if (i.type==='link') txt += star + '🔗 ' + i.url + '\n';
        else txt += star + '📝 ' + (i.title||'Nota') + '\n   ' + (i.text||'').replace(/\n/g,'\n   ') + '\n';
      });
      txt += '\n';
    });
    return txt;
  }
  function exportTxt() {
    var blob = new Blob([buildText()], {type:'text/plain;charset=utf-8'});
    var a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='minhas-notas.txt'; a.click(); URL.revokeObjectURL(a.href);
  }
  function sendEmail() {
    window.location.href = 'mailto:?subject=' + encodeURIComponent('As Minhas Notas e Links') + '&body=' + encodeURIComponent(buildText());
  }

  document.addEventListener('keydown', function(e) {
    if (e.key==='Enter' && document.activeElement.id==='f-url') saveLink();
    if (e.key==='Enter' && document.activeElement.id==='f-newcat-link') addCategory('link');
    if (e.key==='Enter' && document.activeElement.id==='f-newcat-note') addCategory('note');
  });



  // ── MENSAGEM DO DIA ───────────────────────────────────

    { icon:'🌅', text:'Cada amanhecer é uma página em branco. Escreve algo bonito hoje.', author:'— Gerardo Pizo' },

  function loadDayMessage() {
    // Change message each time the app opens (random, not repeat consecutive)
    var lastIdx = parseInt(localStorage.getItem('gerardo-last-msg') || '-1');
    var idx;
    do { idx = Math.floor(Math.random() * MESSAGES.length); } while (idx === lastIdx && MESSAGES.length > 1);
    localStorage.setItem('gerardo-last-msg', idx);
    var m = MESSAGES[idx];
    document.getElementById('msg-day-icon').textContent = m.icon;
    document.getElementById('msg-day-text').textContent = m.text;
    document.getElementById('msg-day-author').textContent = m.author;
  }

  // ── CLIMA + CÂMBIO ────────────────────────────────────
  var infoCache = JSON.parse(localStorage.getItem('gerardo-info-cache') || 'null');

  function trendHtml(cur, prev, decimals) {
    if (prev === null || prev === undefined) return '<span class="trend-neu">— sem dados</span>';
    var diff = cur - prev;
    var pct  = prev !== 0 ? ((diff/prev)*100).toFixed(1) : '0.0';
    if (Math.abs(diff) < 0.001) return '<span class="trend-neu">→ igual</span>';
    if (diff > 0) return '<span class="trend-up">▲ +'+pct+'%</span>';
    return '<span class="trend-down">▼ '+pct+'%</span>';
  }

  function rainEmoji(pct) {
    if (pct === null || pct === undefined) return '🌤';
    if (pct >= 80) return '⛈';
    if (pct >= 60) return '🌧';
    if (pct >= 40) return '🌦';
    if (pct >= 20) return '🌥';
    return '☀️';
  }

  function applyInfo(d, offline) {
    document.getElementById('iw-temp').textContent  = d.temp !== null ? d.temp + '°C' : '--';
    document.getElementById('iw-hum').textContent   = d.hum  !== null ? d.hum  + '%'  : '--';
    document.getElementById('iw-city').textContent  = d.city || 'Brasília';
    var rainPct = d.rain !== null && d.rain !== undefined ? d.rain : null;
    document.getElementById('iw-rain').textContent  = rainPct !== null ? rainEmoji(rainPct) + ' ' + rainPct + '%' : '--';
    document.getElementById('iw-rain-sub').textContent = rainPct !== null
      ? (rainPct >= 70 ? 'Leva guarda-chuva!' : rainPct >= 40 ? 'Pode chover' : 'Provável sol')
      : 'chance';
    document.getElementById('iw-brl-cop').textContent = d.brlCop !== null ? d.brlCop.toFixed(0) : '--';
    document.getElementById('iw-brl-usd').textContent = d.brlUsd !== null ? d.brlUsd.toFixed(4) : '--';
    document.getElementById('iw-brl-cop-t').innerHTML = trendHtml(d.brlCop, d.prevBrlCop, 0);
    document.getElementById('iw-brl-usd-t').innerHTML = trendHtml(d.brlUsd, d.prevBrlUsd, 4);
    document.getElementById('info-offline').style.display = offline ? 'block' : 'none';
  }

  async function fetchWeather(lat, lon) {
    var url = 'https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon
      + '&current=temperature_2m,relative_humidity_2m'
      + '&hourly=precipitation_probability&timezone=auto&forecast_days=1';
    var wRes = await fetch(url);
    var wData = await wRes.json();
    var temp = wData.current ? Math.round(wData.current.temperature_2m) : null;
    var hum  = wData.current ? wData.current.relative_humidity_2m : null;
    // Max precipitation probability for next 12 hours
    var rain = null;
    if (wData.hourly && wData.hourly.precipitation_probability) {
      var probs = wData.hourly.precipitation_probability.slice(0, 12);
      rain = Math.max.apply(null, probs);
    }
    return { temp: temp, hum: hum, rain: rain };
  }

  async function getCity(lat, lon) {
    try {
      var r = await fetch('https://nominatim.openstreetmap.org/reverse?lat='+lat+'&lon='+lon+'&format=json');
      var d = await r.json();
      return d.address ? (d.address.city || d.address.town || d.address.village || d.address.county || 'Aqui') : 'Aqui';
    } catch(e) { return 'Aqui'; }
  }

  function getLocation() {
    return new Promise(function(resolve) {
      if (!navigator.geolocation) { resolve({ lat: -15.78, lon: -47.93, city: 'Brasília' }); return; }
      navigator.geolocation.getCurrentPosition(
        function(pos) { resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, city: null }); },
        function()    { resolve({ lat: -15.78, lon: -47.93, city: 'Brasília' }); },
        { timeout: 6000, maximumAge: 300000 }
      );
    });
  }

  async function fetchInfo() {
    try {
      // 1. Get location
      var loc = await getLocation();
      var city = loc.city || await getCity(loc.lat, loc.lon);

      // 2. Weather + rain from Open-Meteo
      var weather = await fetchWeather(loc.lat, loc.lon);

      // 3. Exchange rates
      var fxRes = await fetch('https://open.er-api.com/v6/latest/BRL');
      var fxData = await fxRes.json();
      var brlCop = fxData.rates ? fxData.rates.COP : null;
      var brlUsd = fxData.rates ? fxData.rates.USD : null;

      var prev = infoCache || {};
      var d = {
        temp: weather.temp, hum: weather.hum, rain: weather.rain, city: city,
        brlCop: brlCop, brlUsd: brlUsd,
        prevBrlCop: prev.brlCop || null,
        prevBrlUsd: prev.brlUsd || null,
        updatedAt: Date.now()
      };
      infoCache = d;
      localStorage.setItem('gerardo-info-cache', JSON.stringify(d));
      applyInfo(d, false);
    } catch(e) {
      if (infoCache) {
        applyInfo(infoCache, true);
      } else {
        document.getElementById('info-offline').style.display = 'block';
        document.getElementById('info-offline').textContent = '📡 Sem internet e sem dados guardados';
      }
    }
  }

  // Load day message
  loadDayMessage();

  // Load immediately
  if (infoCache) applyInfo(infoCache, false); // show cache instantly
  fetchInfo(); // then try to update
  setInterval(fetchInfo, 5 * 60 * 1000); // refresh every 5 min

  render();
</script>
