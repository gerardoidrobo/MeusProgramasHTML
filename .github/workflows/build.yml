name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Encontrar e descompactar o projeto
        run: |
          git log --diff-filter=AM --name-only --pretty=format: -- '*WifiSignalApp*.zip' | awk 'NF' > /tmp/zips.txt
          ZIP=""
          while IFS= read -r f; do
            if [ -f "$f" ]; then ZIP="$f"; break; fi
          done < /tmp/zips.txt
          if [ -z "$ZIP" ]; then
            echo "Nenhum arquivo WifiSignalApp*.zip encontrado no repositório. Arquivos presentes:"
            ls -la
            exit 1
          fi
          echo "Usando: $ZIP"
          mkdir -p work
          unzip -o "$ZIP" -d work
          SETTINGS=$(find work -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts não encontrado dentro do zip."
            exit 1
          fi
          echo "PROJ_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compilar APK (debug)
        run: |
          cd "$PROJ_DIR"
          gradle assembleDebug

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.PROJ_DIR }}/app/build/outputs/apk/debug/app-debug.apk
